name: Rewrite Request

on:
    workflow_dispatch:
        inputs:
            branch:
                description: "Branch to rewrite (defaults to the branch this workflow runs on)"
                required: false
                type: string
            from_commit:
                description: "Start of range to squash (currently unused, full history is
                    replaced, see note below)"
                required: false
                type: string
            to_commit:
                description: "End of range / commit to squash up to (defaults to branch tip)"
                required: false
                type: string
            commit_message:
                description: "Commit message for the squashed commit"
                required: false
                type: string
                default: "redacted"

permissions:
    contents: write
    pull-requests: write

jobs:
    build-rewrite:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Determine branch
              id: vars
              shell: bash
              env:
                  BRANCH_IN: ${{ inputs.branch }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  BRANCH="${BRANCH_IN:-$REF_NAME}"
                  echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

            - name: Build squashed commit on a temp branch
              id: build
              shell: bash
              env:
                  BRANCH: ${{ steps.vars.outputs.branch }}
                  TO: ${{ inputs.to_commit }}
                  MESSAGE: ${{ inputs.commit_message }}
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git fetch origin "$BRANCH"

                  if [ -n "$TO" ]; then
                    git fetch origin "$TO" || true
                    TARGET="$TO"
                  else
                    TARGET="origin/$BRANCH"
                  fi

                  TEMP_BRANCH="rewrite/${BRANCH}"

                  {
                    echo "log<<GH_EOF"
                    git log --oneline "$TARGET" | head -50
                    echo "GH_EOF"
                  } >> "$GITHUB_OUTPUT"
                  COMMIT_COUNT="$(git rev-list --count "$TARGET")"
                  echo "commit_count=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"

                  ROOT_COMMIT="$(git rev-list --max-parents=0 "$TARGET" | tail -1)"

                  git checkout -B "$TEMP_BRANCH" "$TARGET"
                  git reset --soft "$ROOT_COMMIT"
                  git commit --allow-empty -m "${MESSAGE:-redacted}"

                  git push --force origin "HEAD:refs/heads/$TEMP_BRANCH"

            - name: Open review PR
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ steps.vars.outputs.branch }}
                  COMMIT_COUNT: ${{ steps.build.outputs.commit_count }}
                  COMMIT_LOG: ${{ steps.build.outputs.log }}
              run: |
                  set -euo pipefail

                  BODY="Automated history rewrite for \`${BRANCH}\`.

                  **Do not click Merge.** Merging normally adds a merge commit instead of replacing history.

                  Approving this PR triggers a follow-up workflow that:
                  1. Tags the current tip of \`${BRANCH}\` as \`backup/${BRANCH}/<timestamp>-pr<number>\` (for rollback)
                  2. Force-pushes the new history onto \`${BRANCH}\`
                  3. Deletes this temp branch automatically

                  The file diff below will likely be empty, only commit history changed, not content.

                  <details>
                  <summary>Commits being squashed (${COMMIT_COUNT} total, newest 50 shown)</summary>

                  \`\`\`
                  ${COMMIT_LOG}
                  \`\`\`
                  </details>"

                  gh pr create \
                    --base "$BRANCH" \
                    --head "rewrite/${BRANCH}" \
                    --title "History rewrite: ${BRANCH}" \
                    --label "history-rewrite" \
                    --body "$BODY"
